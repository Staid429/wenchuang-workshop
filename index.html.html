<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>文创工坊</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js">
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', serif;
            background: #FDF8F0;
            background-image: radial-gradient(circle at 10% 20%, rgba(212, 177, 91, 0.08) 0%, rgba(195, 39, 43, 0.02) 100%);
            min-height: 100vh;
        }

        .workshop-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #C3272B;
            padding-bottom: 15px;
        }

        .title-section h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #C3272B, #D4B15B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .main-workspace {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .library-panel {
            width: 280px;
            background: #fff;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            height: 80vh;
            overflow-y: auto;
        }

        .material-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            z-index: 2;
        }

        .tag-heritage {
            background: #C3272B;
        }

        .tag-master {
            background: #D4B15B;
        }

        .tag-limited {
            background: #2F5D3A;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #C3272B;
            margin: 15px 0 10px;
            border-left: 4px solid #C3272B;
            padding-left: 10px;
        }

        .upload-area {
            background: #FFF9F0;
            border: 1px dashed #D4B15B;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: #FFF0E0;
            border-color: #C3272B;
        }

        .upload-area i {
            font-size: 24px;
            color: #C3272B;
            margin-bottom: 5px;
            display: block;
        }

        .clip-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .material-item {
            background: #FFF9F0;
            border: 1px solid #F0E2CF;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .material-item:hover {
            border-color: #C3272B;
            transform: translateY(-3px);
            background: #FFF;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        .material-img {
            width: 100%;
            height: 80%;
            object-fit: contain;
            pointer-events: none;
            background: #f4e9db;
            border-radius: 8px;
        }

        .material-label {
            font-size: 12px;
            color: #5c3e1f;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .canvas-area {
            flex: 1;
            min-width: 600px;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            background: #F0F0F0;
            border-radius: 10px;
            overflow: hidden;
        }

        .right-panels {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .property-panel {
            width: 100%;
            background: rgba(255, 250, 240, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(212, 177, 91, 0.3);
        }

        .prop-group {
            margin-bottom: 20px;
        }

        .prop-label {
            font-size: 13px;
            font-weight: 600;
            color: #5e3a22;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #C3272B, #D4B15B);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            border: 2px solid #C3272B;
            cursor: pointer;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            border: 2px solid #E2D8CC;
        }

        select,
        .platform-input {
            width: 100%;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            padding: 0 12px;
            font-size: 14px;
            border: 2px solid #E2D8CC;
            transition: 0.3s;
        }

        .platform-input:focus,
        select:focus {
            border-color: #C3272B;
            outline: none;
        }

        .platform-textarea {
            width: 100%;
            min-height: 80px;
            border-radius: 12px;
            padding: 10px 12px;
            background: white;
            border: 2px solid #E2D8CC;
            resize: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .platform-textarea:focus {
            border-color: #C3272B;
            outline: none;
        }

        .price-display {
            font-size: 24px;
            font-weight: bold;
            color: #C3272B;
            text-align: center;
            padding: 10px;
            background: #FFF9F0;
            border-radius: 12px;
            border: 1px solid #D4B15B;
        }

        .toolbar-row {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
            background: #fff;
            border: 1px solid #E2D8CC;
            color: #5a3e2b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #FFF5E6;
            border-color: #C3272B;
            transform: translateY(-2px);
        }

        .action-btn.active {
            background: #C3272B;
            color: white;
            border-color: #C3272B;
        }

        .action-btn.danger {
            background: #8B6B5C;
            color: white;
            border: none;
        }

        .btn-primary {
            background: #C3272B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-gold {
            background: #D4B15B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        .drawing-tools {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #E2D8CC;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .brush-size-control {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFF9F0;
            padding: 4px 12px;
            border-radius: 40px;
        }

        .modal-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 5, 0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            width: 92%;
            height: 92%;
            background: transparent;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        .close-modal {
            position: absolute;
            right: 24px;
            top: 24px;
            font-size: 28px;
            cursor: pointer;
            z-index: 9999;
            background: rgba(195, 39, 43, 0.95);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            color: white;
            border: 2px solid #D4B15B;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .close-modal:hover {
            background: #D4B15B;
            transform: scale(1.15) rotate(90deg);
            color: #5a3e2b;
        }

        #threeCanvasContainer {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background: #1a0e07;
        }

        .three-controls-ui {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, rgba(30, 15, 10, 0.98), rgba(60, 25, 15, 0.95));
            backdrop-filter: blur(20px);
            padding: 20px 18px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 1200;
            width: 280px;
            max-height: 90vh;
            font-size: 12px;
            color: #FFE4B5;
            border: 1px solid rgba(212, 177, 91, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            overflow-y: auto;
        }

        .three-controls-ui::-webkit-scrollbar {
            width: 4px;
        }

        .three-controls-ui::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }

        .three-controls-ui::-webkit-scrollbar-thumb {
            background: rgba(212, 177, 91, 0.6);
            border-radius: 10px;
        }

        .three-controls-ui .tool-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 177, 91, 0.2);
        }

        .three-controls-ui .group-title {
            color: #D4B15B;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .three-controls-ui .label {
            color: #FFE4B5;
            font-weight: 500;
            font-size: 12px;
            display: block;
        }

        .three-controls-ui button,
        .three-controls-ui select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #D4B15B;
            color: #FFE4B5;
            padding: 9px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
        }

        .three-controls-ui button:hover {
            background: linear-gradient(135deg, #C3272B, #8B1A1E);
            transform: translateY(-2px);
        }

        .three-controls-ui select {
            background: rgba(0, 0, 0, 0.6);
        }

        .three-controls-ui input[type="range"] {
            width: 100%;
            margin: 4px 0;
        }

        .three-controls-ui .btn-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .three-controls-ui .btn-row button {
            flex: 1;
        }

        .custom-color-picker {
            position: relative;
            width: 100%;
        }

        .color-preview-wrapper {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .color-preview-btn {
            flex: 1;
            height: 40px;
            background: #C3272B;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 12px;
            border: 1px solid #D4B15B;
            cursor: pointer;
            transition: 0.2s;
        }

        .color-preview-btn:hover {
            transform: translateY(-2px);
        }

        .color-input-native {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid #D4B15B;
            cursor: pointer;
            padding: 0;
        }

        .color-popover {
            position: absolute;
            bottom: 100%;
            left: 0;
            background: #2a1a10;
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 12px;
            width: 100%;
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #D4B15B;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
            z-index: 1300;
            margin-bottom: 8px;
        }

        .color-popover.active {
            display: flex;
        }

        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 215, 0, 0.6);
            transition: 0.1s;
        }

        .color-swatch:hover {
            transform: scale(1.15);
            border-color: white;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #2a1510, #4a2515);
            color: #FFE4B5;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 2000;
            font-size: 14px;
            border: 1px solid #D4B15B;
            animation: toastIn 0.3s ease-out;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border: 2px solid #9D2933;
            color: #9D2933;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #9D2933;
            color: white;
        }

        .price-tag {
            font-size: 24px;
            color: #FFD700;
            font-weight: bold;
            text-align: center;
            margin: 5px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .price-tag small {
            font-size: 12px;
            color: #aaa;
            font-weight: normal;
        }

        .input-field {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #5a3e2b;
            background: rgba(0, 0, 0, 0.4);
            color: #FFE4B5;
            margin-top: 4px;
        }

        .input-field:focus {
            outline: none;
            border-color: #D4B15B;
        }

        .btn-checkout {
            background: linear-gradient(135deg, #D4B15B, #C3272B);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            border: none;
            box-shadow: 0 4px 15px rgba(212, 177, 91, 0.4);
        }

        .btn-checkout:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        .order-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .order-modal-box {
            background: #2a1a10;
            border: 2px solid #D4B15B;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            color: #FFE4B5;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .order-success-icon {
            font-size: 60px;
            color: #D4B15B;
            margin-bottom: 15px;
        }

        .upload-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .upload-modal-box {
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid #C3272B;
            animation: popIn 0.3s ease-out;
        }

        .upload-success-icon {
            font-size: 70px;
            color: #C3272B;
            margin-bottom: 15px;
        }

        .work-preview-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 16px;
            margin: 15px auto;
            border: 2px solid #D4B15B;
        }

        .work-info {
            text-align: left;
            background: #FDF8F0;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.6;
        }

        .draft-panel {
            width: 280px;
            background: rgba(255, 250, 240, 0.98);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(212, 177, 91, 0.3);
            z-index: 900;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .draft-panel.collapsed .draft-body {
            height: 0;
            padding: 0;
            opacity: 0;
        }

        .draft-header {
            padding: 12px 15px;
            background: linear-gradient(135deg, #C3272B, #D4B15B);
            color: white;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .draft-toggle {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .draft-panel.collapsed .draft-toggle {
            transform: rotate(180deg);
        }

        .draft-body {
            padding: 15px;
            height: auto;
            opacity: 1;
            transition: all 0.3s ease;
        }

        .draft-save-btn {
            width: 100%;
            padding: 8px 12px;
            background: #C3272B;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .draft-save-btn:hover {
            background: #9D2933;
            transform: translateY(-2px);
        }

        .draft-list {
            max-height: 350px;
            overflow-y: auto;
            gap: 8px;
            display: flex;
            flex-direction: column;
        }

        .draft-list::-webkit-scrollbar {
            width: 3px;
        }

        .draft-list::-webkit-scrollbar-thumb {
            background: #D4B15B;
            border-radius: 3px;
        }

        .draft-empty {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 10px 0;
        }

        .draft-item {
            padding: 8px 10px;
            background: #FFF9F0;
            border: 1px solid #F0E2CF;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .draft-item:hover {
            border-color: #C3272B;
            background: white;
        }

        .draft-item-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            color: #5c3e1f;
        }

        .draft-item-actions {
            display: flex;
            gap: 6px;
        }

        .draft-item-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 11px;
            color: #C3272B;
        }

        .draft-item-btn.del {
            color: #8B6B5C;
        }
    </style>
</head>
<body>
    <div class="workshop-container">
        <div class="header">
            <div class="back-section"><a href="#" class="btn-back" id="dummyBackBtn"><i class="fas fa-arrow-left"></i> 返回</a></div>
            <div class="title-section">
                <h1><i class="fas fa-cut"></i> 文创工坊 </h1>
            </div>
            <div class="action-buttons">
                <button class="btn-primary" id="exportPngBtn">导出图片</button>
                <button class="btn-gold" id="preview3DBtn">🏺 3D 文创预览</button>
            </div>
        </div>
        <div class="main-workspace">
            <div>
                <div class="library-panel" id="libraryPanel">
                    <div class="section-title">✂️ 素材库</div>
                    <div class="upload-area" id="uploadLocalImage">
                        <i class="fas fa-cloud-upload-alt"></i><span>点击上传本地图片</span>
                        <input type="file" id="localImageInput" accept="image/*" style="display: none;">
                    </div>
                    <div class="clip-grid" id="materialGrid">
                        <div class="material-item"><span class="material-tag tag-heritage">非遗</span><img class="material-img" src="img/gfwy01.png" alt="纹样1" data-pattern="tuanyun"><div class="material-label">纹样01</div></div>
                        <div class="material-item"><span class="material-tag tag-master">大师</span><img class="material-img" src="img/gfwy05.png" alt="纹样2" data-pattern="huiwen"><div class="material-label">纹样02</div></div>

    <!-- 纹样图片自动生成脚本 -->
    <script>
        (function() {
            // 为所有纹样图片生成独特的中国传统纹样SVG图案
            function generatePatternSVG(patternType, size) {
                size = size || 200;
                const half = size / 2;
                let svgContent = '';
                const bgColor = '#f4e9db';

                // 基础SVG容器
                const svgStart = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
                const svgEnd = `</svg>`;

                switch (patternType) {
                    case 'tuanyun':
                        // 团花云纹 - 红色多层圆形花瓣
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      <circle cx="0" cy="0" r="${half*0.78}" fill="none" stroke="#C3272B" stroke-width="3"/>
                      <circle cx="0" cy="0" r="${half*0.55}" fill="none" stroke="#D4B15B" stroke-width="2"/>
                      ${Array.from({length:8}, (_,i) => {
                        const angle = (i/8)*Math.PI*2;
                        const x1 = Math.cos(angle)*half*0.32;
                        const y1 = Math.sin(angle)*half*0.32;
                        const x2 = Math.cos(angle)*half*0.7;
                        const y2 = Math.sin(angle)*half*0.7;
                        return `<ellipse cx="${(x1+x2)/2}" cy="${(y1+y2)/2}" rx="${half*0.18}" ry="${half*0.28}" fill="#C3272B" opacity="0.7" transform="rotate(${(i/8)*360},${(x1+x2)/2},${(y1+y2)/2})"/>`;
                      }).join('')}
                      <circle cx="0" cy="0" r="${half*0.18}" fill="#D4B15B"/>
                      <circle cx="0" cy="0" r="${half*0.08}" fill="#C3272B"/>
                      ${Array.from({length:12}, (_,i) => {
                        const a = (i/12)*Math.PI*2;
                        return `<circle cx="${Math.cos(a)*half*0.62}" cy="${Math.sin(a)*half*0.62}" r="6" fill="#D4B15B" opacity="0.8"/>`;
                      }).join('')}
                    </g>`;
                        break;
                    case 'huiwen':
                        // 回纹 - 金色连续回形几何纹
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      <rect x="${-half*0.72}" y="${-half*0.72}" width="${size*0.72}" height="${size*0.72}" fill="none" stroke="#D4B15B" stroke-width="3"/>
                      ${Array.from({length:4}, (_,q) => {
                        const ox = [1,1,-1,-1][q];
                        const oy = [1,-1,-1,1][q];
                        let paths = '';
                        for(let i=0;i<3;i++){
                          const base = half*0.6 - i*half*0.16;
                          const inner = base - half*0.1;
                          paths += `<path d="M${ox*base},${oy*base} L${ox*base},${oy*inner} L${ox*inner},${oy*inner} L${ox*inner},${oy*base}" fill="none" stroke="#D4B15B" stroke-width="2" opacity="${1-i*0.25}"/>`;
                        }
                        return paths;
                      }).join('')}
                      <circle cx="0" cy="0" r="${half*0.15}" fill="#C3272B" opacity="0.6"/>
                      <circle cx="0" cy="0" r="${half*0.06}" fill="#D4B15B"/>
                    </g>`;
                        break;
                    case 'lianhua':
                        // 莲花纹 - 红色八瓣莲花
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      ${Array.from({length:8}, (_,i) => {
                        const angle = (i/8)*Math.PI*2 - Math.PI/2;
                        const cx = Math.cos(angle)*half*0.22;
                        const cy = Math.sin(angle)*half*0.22;
                        return `<ellipse cx="${cx}" cy="${cy}" rx="${half*0.38}" ry="${half*0.16}" fill="#C3272B" opacity="0.75" transform="rotate(${angle*(180/Math.PI)+90},${cx},${cy})"/>`;
                      }).join('')}
                      ${Array.from({length:8}, (_,i) => {
                        const angle = (i/8)*Math.PI*2 - Math.PI/2 + Math.PI/8;
                        const cx2 = Math.cos(angle)*half*0.44;
                        const cy2 = Math.sin(angle)*half*0.44;
                        return `<ellipse cx="${cx2}" cy="${cy2}" rx="${half*0.22}" ry="${half*0.09}" fill="#2F5D3A" opacity="0.5" transform="rotate(${angle*(180/Math.PI)+90},${cx2},${cy2})"/>`;
                      }).join('')}
                      <circle cx="0" cy="0" r="${half*0.2}" fill="#D4B15B"/>
                      <circle cx="0" cy="0" r="${half*0.08}" fill="#C3272B"/>
                    </g>`;
                        break;
                    case 'fangsheng':
                        // 方胜纹 - 金色菱形交错
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      <rect x="${-half*0.6}" y="${-half*0.6}" width="${size*0.6}" height="${size*0.6}" fill="none" stroke="#D4B15B" stroke-width="2.5" transform="rotate(45)"/>
                      <rect x="${-half*0.42}" y="${-half*0.42}" width="${size*0.42}" height="${size*0.42}" fill="none" stroke="#C3272B" stroke-width="2" transform="rotate(45)"/>
                      <rect x="${-half*0.24}" y="${-half*0.24}" width="${size*0.24}" height="${size*0.24}" fill="#D4B15B" opacity="0.5" transform="rotate(45)"/>
                      <circle cx="0" cy="0" r="${half*0.06}" fill="#C3272B"/>
                      ${Array.from({length:4}, (_,i) => {
                        const a = (i/4)*Math.PI*2 + Math.PI/4;
                        return `<circle cx="${Math.cos(a)*half*0.5}" cy="${Math.sin(a)*half*0.5}" r="5" fill="#D4B15B"/>`;
                      }).join('')}
                    </g>`;
                        break;
                    case 'ruyi':
                        // 如意云纹 - 红色如意云头
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      <path d="M${-half*0.55},${half*0.15} C${-half*0.55},${-half*0.2} ${-half*0.2},${-half*0.55} ${half*0.05},${-half*0.4} C${half*0.3},${-half*0.25} ${half*0.5},${half*0.0} ${half*0.45},${half*0.3} C${half*0.4},${half*0.55} ${half*0.05},${half*0.6} ${-half*0.15},${half*0.45}" fill="#C3272B" opacity="0.7"/>
                      <path d="M${-half*0.35},${half*0.05} C${-half*0.35},${-half*0.1} ${-half*0.1},${-half*0.3} ${half*0.05},${-half*0.2} C${half*0.18},${-half*0.1} ${half*0.28},${half*0.05} ${half*0.22},${half*0.2}" fill="#D4B15B" opacity="0.6"/>
                      <circle cx="${-half*0.35}" cy="${half*0.25}" r="${half*0.12}" fill="#C3272B" opacity="0.5"/>
                    </g>`;
                        break;
                    case 'panchang':
                        // 盘长纹 - 金色盘长结
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      ${Array.from({length:4}, (_,i) => {
                        const a = (i/4)*Math.PI*2;
                        const x = Math.cos(a)*half*0.3;
                        const y = Math.sin(a)*half*0.3;
                        return `<path d="M${x},${y} C${x+half*0.15},${y-half*0.3} ${x-half*0.15},${y+half*0.3} ${x},${y}" fill="none" stroke="#D4B15B" stroke-width="3" opacity="0.8"/>`;
                      }).join('')}
                      <circle cx="0" cy="0" r="${half*0.5}" fill="none" stroke="#C3272B" stroke-width="2" stroke-dasharray="8,4"/>
                      <circle cx="0" cy="0" r="${half*0.2}" fill="#D4B15B" opacity="0.5"/>
                      <circle cx="0" cy="0" r="${half*0.06}" fill="#C3272B"/>
                    </g>`;
                        break;
                    case 'bianfu':
                        // 蝙蝠纹 - 红色蝙蝠（福）
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half+half*0.1})">
                      <ellipse cx="0" cy="${-half*0.1}" rx="${half*0.6}" ry="${half*0.35}" fill="#C3272B" opacity="0.7"/>
                      <ellipse cx="${-half*0.45}" cy="${-half*0.3}" rx="${half*0.28}" ry="${half*0.18}" fill="#C3272B" opacity="0.7" transform="rotate(-30,${-half*0.45},${-half*0.3})"/>
                      <ellipse cx="${half*0.45}" cy="${-half*0.3}" rx="${half*0.28}" ry="${half*0.18}" fill="#C3272B" opacity="0.7" transform="rotate(30,${half*0.45},${-half*0.3})"/>
                      <circle cx="0" cy="${-half*0.15}" r="${half*0.12}" fill="#D4B15B"/>
                      <circle cx="${-half*0.3}" cy="${half*0.05}" r="${half*0.06}" fill="#D4B15B" opacity="0.6"/>
                      <circle cx="${half*0.3}" cy="${half*0.05}" r="${half*0.06}" fill="#D4B15B" opacity="0.6"/>
                    </g>`;
                        break;
                    case 'tongqian':
                        // 铜钱纹 - 金色圆形方孔
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      <circle cx="0" cy="0" r="${half*0.7}" fill="#D4B15B" opacity="0.7"/>
                      <circle cx="0" cy="0" r="${half*0.58}" fill="${bgColor}"/>
                      <rect x="${-half*0.25}" y="${-half*0.25}" width="${half*0.5}" height="${half*0.5}" fill="#D4B15B" opacity="0.7"/>
                      <rect x="${-half*0.2}" y="${-half*0.2}" width="${half*0.4}" height="${half*0.4}" fill="${bgColor}"/>
                      ${Array.from({length:4}, (_,i) => {
                        const a = (i/4)*Math.PI*2 + Math.PI/4;
                        const r = half*0.64;
                        return `<circle cx="${Math.cos(a)*r}" cy="${Math.sin(a)*r}" r="4" fill="#C3272B"/>`;
                      }).join('')}
                    </g>`;
                        break;
                    case 'shuibo':
                        // 水波纹 - 红色波浪纹
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g>
                      ${Array.from({length:6}, (_,i) => {
                        const y = half*0.25 + i*half*0.22;
                        const amp = half*0.25 - i*2;
                        const color = i%2===0 ? '#C3272B' : '#D4B15B';
                        return `<path d="M${half*0.1},${y} Q${half*0.3},${y-amp} ${half*0.5},${y} Q${half*0.7},${y+amp} ${half*0.9},${y}" fill="none" stroke="${color}" stroke-width="3" opacity="${1-i*0.12}"/>`;
                      }).join('')}
                      <circle cx="${half}" cy="${half}" r="${half*0.15}" fill="#C3272B" opacity="0.4"/>
                      <circle cx="${half}" cy="${half}" r="${half*0.05}" fill="#D4B15B"/>
                    </g>`;
                        break;
                    case 'shou':
                        // 寿字纹简化 - 金色
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">
                      <rect x="${-half*0.5}" y="${-half*0.6}" width="${size*0.5}" height="${size*0.6}" fill="none" stroke="#D4B15B" stroke-width="3"/>
                      <line x1="${-half*0.3}" y1="${-half*0.6}" x2="${-half*0.3}" y2="${half*0.0}" stroke="#D4B15B" stroke-width="2"/>
                      <line x1="${half*0.0}" y1="${-half*0.6}" x2="${half*0.0}" y2="${half*0.0}" stroke="#D4B15B" stroke-width="2"/>
                      <rect x="${-half*0.45}" y="${half*0.05}" width="${half*0.9}" height="${half*0.35}" fill="none" stroke="#C3272B" stroke-width="2.5"/>
                      <line x1="${-half*0.45}" y1="${half*0.2}" x2="${half*0.45}" y2="${half*0.2}" stroke="#C3272B" stroke-width="1.5"/>
                      <circle cx="0" cy="${-half*0.15}" r="${half*0.1}" fill="#D4B15B" opacity="0.5"/>
                    </g>`;
                        break;
                    case 'fengwei':
                        // 凤尾纹 - 红色弧形羽毛
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half*0.3})">
                      ${Array.from({length:7}, (_,i) => {
                        const a = -Math.PI/2 + (i-3)*Math.PI/14;
                        const len = half*0.7 - Math.abs(i-3)*half*0.1;
                        const ex = Math.cos(a)*len;
                        const ey = Math.sin(a)*len;
                        const color = i%2===0 ? '#C3272B' : '#D4B15B';
                        return `<path d="M0,0 Q${ex*0.5},${ey*0.5} ${ex},${ey}" fill="none" stroke="${color}" stroke-width="${4-Math.abs(i-3)*0.4}" opacity="${1-Math.abs(i-3)*0.08}"/>`;
                      }).join('')}
                      <circle cx="0" cy="${-half*0.05}" r="${half*0.12}" fill="#C3272B" opacity="0.6"/>
                      <circle cx="0" cy="${-half*0.05}" r="${half*0.04}" fill="#D4B15B"/>
                      ${Array.from({length:5}, (_,i) => {
                        const a2 = -Math.PI/2 + (i-2)*Math.PI/20;
                        const r2 = half*0.55;
                        return `<circle cx="${Math.cos(a2)*r2}" cy="${Math.sin(a2)*r2}" r="3" fill="#2F5D3A" opacity="0.6"/>`;
                      }).join('')}
                    </g>`;
                        break;
                    case 'long':
                        // 龙纹简化 - 金色盘旋
                        svgContent = `
                    <rect width="${size}" height="${size}" fill="${bgColor}" rx="8"/>
                    <g transform="translate(${half},${half})">

                const h = img.height * scale;
                const x = (size - w) / 2;
                const y = (size - h) / 2;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.clearRect(0, 0, size, size);
                ctx.drawImage(img, x, y, w, h);

                texture.magFilter = THREE.LinearFilter;
                const target = threeMesh.userData?.isGroup ? threeMesh.userData.mainMesh : threeMesh;
                if (target?.material) {

                cropCanvas.height = size;
                const ctx = cropCanvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.clearRect(0, 0, size, size);
                ctx.save();
                if (shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.clip();
                } else if (shape === 'rect') {
                    const rectW = size * 0.8,
                        rectH = size * 0.8;
                    ctx.beginPath();
                    ctx.rect((size - rectW) / 2, (size - rectH) / 2, rectW, rectH);
                    ctx.clip();
                }
                ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, size, size);
                ctx.restore();
                applyTextureTo3D(cropCanvas.toDataURL('image/png'));
                showToast(`${shape==='circle'?'圆形':'矩形'}裁剪`, '✂️');

                    group.add(rim);
                    const legGeo = new THREE.CylinderGeometry(0.22, 0.28, 1.2, 16);
                    const legPositions = [
                        [-0.8, 0.6, 0.8],
                        [0.8, 0.6, 0.8],
                        [0.8, 0.6, -0.8],
                        [-0.8, 0.6, -0.8]
                    ];
                    legPositions.forEach(pos => {
                        const leg = new THREE.Mesh(legGeo, mat.clone());
                        leg.position.set(pos[0], pos[1], pos[2]);
                        group.add(leg);
                    });
                    const earGeo = new THREE.BoxGeometry(0.5, 0.5, 0.15);
                    const ear1 = new THREE.Mesh(earGeo, mat.clone());
                    ear1.position.set(1.0, 2.1, 0);
                    ear1.rotation.z = 0.1;
                    group.add(ear1);
                    const ear2 = ear1.clone();
                    ear2.position.x = -1.0;
                    ear2.rotation.z = -0.1;
                    group.add(ear2);
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: body
                    };
                } else if (type === 'fan') {
                    group = new THREE.Group();
                    const fanRadius = 1.5;
                    const fanGeo = new THREE.CircleGeometry(fanRadius, 64);
                    fanGeo.computeVertexNormals();
                    const fanMat = mat.clone();
                    fanMat.side = THREE.DoubleSide;
                    const fanFace = new THREE.Mesh(fanGeo, fanMat);
                    fanFace.position.set(0, 1.2, 0);
                    group.add(fanFace);
                    mainMesh = fanFace;
                    const handleMat = new THREE.MeshStandardMaterial({
                        color: 0x8B4513,
                        roughness: 0.6,
                        metalness: 0.1
                    });
                    const handleGeo = new THREE.CylinderGeometry(0.09, 0.13, 1.8, 16);
                    const handle = new THREE.Mesh(handleGeo, handleMat);
                    handle.position.set(0, -0.2, 0);
                    group.add(handle);
                    const hoopMat = new THREE.MeshStandardMaterial({
                        color: 0xD4B15B,
                        metalness: 0.85,
                        roughness: 0.15
                    });
                    const hoop = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.06, 16), hoopMat);
                    hoop.position.set(0, 0.67, 0);
                    group.add(hoop);
                    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), hoopMat.clone());
                    knob.position.set(0, -1.1, 0);
                    group.add(knob);
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: fanFace
                    };
                } else if (type === 'vase') {
                    const points = [];
                    points.push(new THREE.Vector2(0.1, -1.5));
                    points.push(new THREE.Vector2(0.4, -1.4));
                    points.push(new THREE.Vector2(0.5, -1.2));
                    points.push(new THREE.Vector2(0.8, -0.5));
                    points.push(new THREE.Vector2(1.0, 0.0));
                    points.push(new THREE.Vector2(0.9, 0.5));
                    points.push(new THREE.Vector2(0.6, 0.9));
                    points.push(new THREE.Vector2(0.25, 1.1));
                    points.push(new THREE.Vector2(0.25, 1.3));
                    points.push(new THREE.Vector2(0.35, 1.35));
                    points.push(new THREE.Vector2(0.38, 1.4));
                    points.push(new THREE.Vector2(0.35, 1.42));
                    const vaseGeo = new THREE.LatheGeometry(points, 64);
                    const lengths = [0];
                    for (let i = 1; i < points.length; i++) lengths.push(lengths[lengths.length - 1] + points[i]
                        .distanceTo(points[i - 1]));
                    const totalLength = lengths[lengths.length - 1];
                    const uvAttribute = vaseGeo.getAttribute('uv');
                    for (let i = 0; i <= 64; i++)
                        for (let j = 0; j < points.length; j++) uvAttribute.setXY(i * points.length + j, i / 64, lengths[
                            j] / totalLength);
                    uvAttribute.needsUpdate = true;
                    vaseGeo.computeVertexNormals();
                    const vase = new THREE.Mesh(vaseGeo, mat.clone());
                    vase.rotation.y = Math.PI;
                    threeMesh = vase;
                    vase.userData = {
                        isGroup: false,
                        mainMesh: vase
                    };
                } else if (type === 'square') {
                    group = new THREE.Group();
                    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), mat.clone());
                    plane.rotation.x = -Math.PI / 2;
                    group.add(plane);
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: plane
                    };
                } else if (type === 'gourd') {
                    group = new THREE.Group();
                    const sphereGeo1 = new THREE.SphereGeometry(0.8, 32, 32);
                    const sphere1 = new THREE.Mesh(sphereGeo1, mat.clone());
                    sphere1.position.y = 0.8;
                    group.add(sphere1);
                    mainMesh = sphere1;
                    const sphereGeo2 = new THREE.SphereGeometry(0.5, 32, 32);
                    const sphere2 = new THREE.Mesh(sphereGeo2, mat.clone());
                    sphere2.position.y = 1.8;
                    group.add(sphere2);
                    const neckGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.4, 16);
                    const neck = new THREE.Mesh(neckGeo, mat.clone());
                    neck.position.y = 2.3;
                    group.add(neck);
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: mainMesh
                    };
                } else if (type === 'lantern') {
                    group = new THREE.Group();
                    const bodyGeo = new THREE.CylinderGeometry(1.0, 1.2, 2.0, 32, 1, true);
                    const body = new THREE.Mesh(bodyGeo, mat.clone());
                    body.position.y = 0.5;
                    group.add(body);
                    mainMesh = body;
                    const topGeo = new THREE.CircleGeometry(1.0, 32);
                    const top = new THREE.Mesh(topGeo, mat.clone());
                    top.rotation.x = -Math.PI / 2;
                    top.position.y = 1.5;
                    group.add(top);
                    const bottomGeo = new THREE.CircleGeometry(1.2, 32);
                    const bottom = new THREE.Mesh(bottomGeo, mat.clone());
                    bottom.rotation.x = Math.PI / 2;
                    bottom.position.y = -0.5;
                    group.add(bottom);
                    const ringMat = new THREE.MeshStandardMaterial({
                        color: 0xD4B15B,
                        metalness: 0.8,
                        roughness: 0.2
                    });
                    const ringGeo = new THREE.TorusGeometry(1.1, 0.05, 8, 32);
                    const ring1 = new THREE.Mesh(ringGeo, ringMat);
                    ring1.rotation.x = Math.PI / 2;
                    ring1.position.y = 1.0;
                    group.add(ring1);
                    const ring2 = ring1.clone();
                    ring2.position.y = 0;
                    group.add(ring2);
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: mainMesh
                    };
                } else if (type === 'cong') {
                    group = new THREE.Group();
                    const outerGeo = new THREE.BoxGeometry(1.8, 2.5, 1.8);
                    const outer = new THREE.Mesh(outerGeo, mat.clone());
                    outer.position.y = 1.25;
                    group.add(outer);
                    mainMesh = outer;
                    const innerGeo = new THREE.CylinderGeometry(0.6, 0.6, 2.6, 32);
                    const innerMat = new THREE.MeshStandardMaterial({
                        color: 0x2a1a10,
                        roughness: 0.8
                    });
                    const inner = new THREE.Mesh(innerGeo, innerMat);
                    inner.position.y = 1.25;
                    group.add(inner);
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: mainMesh
                    };
                } else if (type === 'ruyi') {
                    group = new THREE.Group();
                    const handleCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(-1.5, 0, 0), new THREE.Vector3(-
                        0.5, 0.2, 0), new THREE.Vector3(0.5, -0.1, 0), new THREE.Vector3(1.5, 0.3, 0)
                    ]);
                    const handleGeo = new THREE.TubeGeometry(handleCurve, 32, 0.1, 8, false);
                    const handle = new THREE.Mesh(handleGeo, mat.clone());
                    group.add(handle);
                    const headGeo = new THREE.SphereGeometry(0.4, 32, 32);
                    headGeo.scale(1.5, 0.8, 1);
                    const head = new THREE.Mesh(headGeo, mat.clone());
                    head.position.set(1.5, 0.3, 0);
                    head.rotation.z = 0.3;
                    group.add(head);
                    mainMesh = head;
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: mainMesh
                    };
                } else if (type === 'foldingFan') {
                    group = new THREE.Group();
                    const fanGeo = new THREE.CircleGeometry(1.5, 64, 0, Math.PI);
                    const fanMat = mat.clone();
                    fanMat.side = THREE.DoubleSide;
                    const fanFace = new THREE.Mesh(fanGeo, fanMat);
                    fanFace.rotation.z = Math.PI / 2;
                    fanFace.position.set(0, 0.5, 0);
                    group.add(fanFace);
                    mainMesh = fanFace;
                    const ribMat = new THREE.MeshStandardMaterial({
                        color: 0x8B4513,
                        roughness: 0.6
                    });
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 11) * Math.PI - Math.PI / 2;
                        const ribGeo = new THREE.BoxGeometry(0.02, 1.6, 0.02);
                        const rib = new THREE.Mesh(ribGeo, ribMat);
                        rib.position.set(Math.cos(angle) * 0.75, 0.5 + Math.sin(angle) * 0.75, 0);
                        rib.rotation.z = angle + Math.PI / 2;
                        group.add(rib);
                    }
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: fanFace
                    };
                } else if (type === 'brushPot') {
                    group = new THREE.Group();
                    const potGeo = new THREE.CylinderGeometry(0.8, 0.9, 1.8, 32, 1, true);
                    const pot = new THREE.Mesh(potGeo, mat.clone());
                    pot.position.y = 0.9;
                    group.add(pot);
                    mainMesh = pot;
                    const bottomGeo = new THREE.CircleGeometry(0.85, 32);
                    const bottom = new THREE.Mesh(bottomGeo, mat.clone());
                    bottom.rotation.x = Math.PI / 2;
                    bottom.position.y = 0;
                    group.add(bottom);
                    const rimGeo = new THREE.TorusGeometry(0.85, 0.05, 8, 32);
                    const rimMat = new THREE.MeshStandardMaterial({
                        color: 0x5e2e1c,
                        roughness: 0.5
                    });
                    const rim = new THREE.Mesh(rimGeo, rimMat);
                    rim.rotation.x = Math.PI / 2;
                    rim.position.y = 1.8;
                    group.add(rim);
                    threeMesh = group;
                    group.userData = {
                        isGroup: true,
                        mainMesh: mainMesh
                    };
                } else {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), mat.clone());
                    threeMesh = m;
                }
            }
            scene.add(threeMesh);
        }

        function animate() {
            animationFrameId = requestAnimationFrame(animate);
            if (threeControls) threeControls.update();
            if (threeRenderer && threeScene && threeCamera) threeRenderer.render(threeScene, threeCamera);
        }

        function disposeThreeResources() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (threeRenderer) {
                threeRenderer.dispose();
                threeRenderer.forceContextLoss();
                threeRenderer = null;
            }
            threeScene = threeCamera = threeControls = threeMesh = threeGridHelper = null;
        }

            document.getElementById('autoPrice').innerText = `¥${price}`;
        }

        document.getElementById('previewWorkBtn').addEventListener('click', () => {
            const workName = document.getElementById('workName').value;
            if (!workName) {
                showToast('请先填写作品名称', '⚠️');
                return;
            }
            const imgData = canvasEl.toDataURL({
                format: 'png',
                multiplier: 1.5
            });
            document.getElementById('workPreviewImg').src = imgData;
            showToast('作品预览生成成功', '👁️');
        });

        document.getElementById('uploadWorkBtn').addEventListener('click', () => {
            const workName = document.getElementById('workName').value;
            const workCategory = document.getElementById('workCategory').value;
            const workDesc = document.getElementById('workDesc').value;
            const workPrice = calculatePlatformPrice();

            if (!workName) {
                showToast('请填写作品名称', '⚠️');
                return;
            }
            if (workDesc.length < 10) {
                showToast('作品描述至少10个字', '⚠️');
                return;
            }

            const workId = 'ZP' + Date.now().toString().slice(-10);
            const categoryMap = {
                heritage: '非遗典藏',
                festival: '节日喜庆',
                decor: '家居装饰',
                gift: '文创礼品',
                custom: '私人定制'
            };
            const categoryName = categoryMap[workCategory];
            const imgData = canvasEl.toDataURL({
                format: 'png',
                multiplier: 2
            });

            document.getElementById('workPreviewImg').src = imgData;
            document.getElementById('uploadWorkInfo').innerHTML = `
            <p><strong>作品ID：</strong> ${workId}</p>
            <p><strong>作品名称：</strong> ${workName}</p>
            <p><strong>作品分类：</strong> ${categoryName}</p>
            <p><strong>作品售价：</strong> ¥${workPrice}</p>
            <p><strong>状态：</strong> <span style="color:#C3272B; font-weight:bold;">待制作发货</span></p>
            <p><strong>说明：</strong> 平台将根据您的作品进行手工制作，完成后通过物流发送至您预留的地址</p>
          `;

            document.getElementById('uploadModalOverlay').style.display = 'flex';
            showToast('作品上传成功，已上架平台', '✅');
        });

        window.closeUploadModal = function() {
            document.getElementById('uploadModalOverlay').style.display = 'none';
            document.getElementById('workName').value = '';
            document.getElementById('workDesc').value = '';
        }

        window.addEventListener('load', () => {
            refreshAutoPrice();
            sizeSelect.addEventListener('change', refreshAutoPrice);
            canvasEl.on('object:added', refreshAutoPrice);
            canvasEl.on('object:removed', refreshAutoPrice);
        });

        const draftPanel = document.getElementById('draftPanel');
        const draftHeader = document.getElementById('draftHeader');
        const draftList = document.getElementById('draftList');
        const saveDraftBtn = document.getElementById('saveDraftBtn');

        draftHeader.addEventListener('click', () => {
            draftPanel.classList.toggle('collapsed');
        });

        function getDrafts() {
            const drafts = localStorage.getItem('papercutDrafts');
            return drafts ? JSON.parse(drafts) : [];
        }

        function saveDraft() {
            const drafts = getDrafts();
            const canvasData = canvasEl.toJSON();
            const now = new Date();
            const timeStr =
                `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            const draft = {
                id: Date.now(),
                name: `草稿_${timeStr}`,
                data: canvasData,
                time: now.toLocaleString()
            };
            drafts.unshift(draft);
            if (drafts.length > 10) drafts.pop();
            localStorage.setItem('papercutDrafts', JSON.stringify(drafts));
            renderDraftList();
            showToast('草稿保存成功', '💾');
        }

        function renderDraftList() {
            const drafts = getDrafts();
            draftList.innerHTML = '';
            if (drafts.length === 0) {
                draftList.innerHTML = '<div class="draft-empty">暂无草稿记录</div>';
                return;
            }
            drafts.forEach(draft => {
                const item = document.createElement('div');
                item.className = 'draft-item';
                item.innerHTML = `
              <div class="draft-item-name" title="${draft.name}">${draft.name}</div>
              <div class="draft-item-actions">
                <button class="draft-item-btn load" data-id="${draft.id}"><i class="fas fa-download"></i></button>
                <button class="draft-item-btn del" data-id="${draft.id}"><i class="fas fa-trash"></i></button>
              </div>
            `;
                draftList.appendChild(item);
            });

            document.querySelectorAll('.draft-item-btn.load').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const drafts = getDrafts();
                    const draft = drafts.find(d => d.id === id);
                    if (draft) {
                        canvasEl.loadFromJSON(draft.data, () => {
                            canvasEl.renderAll();
                            sync3DIfOpen();
                            showToast('草稿加载成功', '📂');
                        });
                    }
                });
            });

            document.querySelectorAll('.draft-item-btn.del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    let drafts = getDrafts();
                    drafts = drafts.filter(d => d.id !== id);
                    localStorage.setItem('papercutDrafts', JSON.stringify(drafts));
                    renderDraftList();
                    showToast('草稿已删除', '🗑️');
                });
            });
        }

        saveDraftBtn.addEventListener('click', saveDraft);
        window.addEventListener('load', renderDraftList);
    </script>
</body>
</html>
